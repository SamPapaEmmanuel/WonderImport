services:
  - type: web
    name: wonderimport-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: DB_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        sync: false # Supabase Transaction Pooler URL (port 6543)
      - key: DIRECT_URL
        sync: false # Supabase Direct/Session URL (port 5432 for migrations)
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase Service Role Secret Key (for admin invites)
      - key: WEB_ORIGIN
        sync: false # Vercel URL: https://<your-project>.vercel.app
