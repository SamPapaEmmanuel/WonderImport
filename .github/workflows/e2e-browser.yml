name: Browser tests (staging)

# Runs Playwright workflows and the accessibility scan against a deployed STAGING environment.
# Never point it at production: the tests create goods, imports and exports.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging web address, e.g. https://staging.wonderimport.example
        required: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
